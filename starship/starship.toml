# from https://twitter.com/StarshipPrompt/status/1440380145861226496?s=20
format = """
$conda\
$username\
$all\
$time\
$line_break\
$character
"""

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[✖](bold red)'

[directory]
# What is this?
truncation_length = 1000
# truncation_symbol = '…/'
style="bold bright-yellow"

# The time (inline, after the rest of the prompt, with 5 spaces of breathing room).
# Previously sat on the right via $fill, but that padded with spaces and made
# copy/paste into notes/Claude messy.
# https://starship.rs/config/#time
[time]
disabled = false
style = "dimmed bright-black"
format = "     [$time]($style)"
# eg Mon Jun 26 14:57:14 2023, see https://docs.rs/chrono/0.4.7/chrono/format/strftime/index.html
time_format = "%c"

[username]
style_user = 'black bold'
style_root = 'white bold'
format = '[$user]($style)'
disabled = false
show_always = true

[hostname]
ssh_only = false
format = '[@$hostname]($style) 🌎 : '
# format = '[$ssh_symbol$hostname]($style) in '
# ssh_symbol = '🌎'

[conda]
# format = '[$symbol$environment](dimmed green) '
format = '[\($environment\)](dimmed green) '
ignore_base = false

### Annoying stuff to disable for now ###

[python]
# Default format (for reference):
#   format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
#   Renders VERY BRIGHT as:  via 🐍 v3.11.15        ('via' uncolored, rest in bold yellow)
# Override below pulls 'via' inside the styled bracket so it dims with the rest.
# Renders NOW DIMMED as:     via 🐍 v3.11.15        (whole span dim bright-black; emoji stays vivid — terminals ignore ANSI dim on emoji glyphs)
style = "dimmed bright-black"
format = '[via ${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
python_binary = [
  # this is the python from PATH if in a pixi shell
  # (assuming you don't have python on your global PATH)
  "python",
  # fall back to pixi's python if it's available
  ".pixi/envs/default/bin/python",
]

[pixi]
# Default format (for reference):
#   format = 'via [$symbol($version )(\($environment\) )]($style)'
#   Renders VERY BRIGHT as:  via 🧚 v0.68.0         ('via' uncolored, rest in bold yellow)
# Override below pulls 'via' inside the styled bracket so it dims with the rest.
# Renders NOW DIMMED as:     via 🧚 v0.68.0         (whole span dim bright-black; emoji stays vivid — terminals ignore ANSI dim on emoji glyphs)
style = "dimmed bright-black"
format = '[via $symbol($version )(\($environment\) )]($style)'

[nodejs]
# Javascript
# Default format (for reference):
#   format = 'via [$symbol($version )]($style)'
#   Renders VERY BRIGHT as:  via  v22.10.0         ('via' uncolored, rest in bold green)
# Override below pulls 'via' inside the styled bracket so it dims with the rest.
# Renders NOW DIMMED as:     via  v22.10.0         (whole span dim bright-black; nerd-font glyph stays vivid)
style = "dimmed bright-black"
format = '[via $symbol($version )]($style)'

[rlang]
# R
# Default format (for reference):
#   format = 'via [$symbol($version )]($style)'
#   Renders VERY BRIGHT as:  via 📐 v4.5.1         ('via' uncolored, rest in bold blue)
# Override below pulls 'via' inside the styled bracket so it dims with the rest.
# Renders NOW DIMMED as:     via 📐 v4.5.1         (whole span dim bright-black; emoji stays vivid)
style = "dimmed bright-black"
format = '[via $symbol($version )]($style)'

[gcloud]
# Looks like this: 
#     on ☁️
disabled = true


